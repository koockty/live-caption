<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Live Captions 悬浮字幕</title><link rel="stylesheet" href="overlay.css"><script type="module" src="overlay.js"></script></head><body><main id="panel"><header><div class="drag-handle"><span class="grip" aria-hidden="true">⠿</span><span>LIVE CAPTIONS</span><span class="pin">置顶</span></div><div class="controls"><button id="mode" aria-pressed="false">仅中文</button><label>字号 <input id="font" aria-label="字幕字号" type="range" min="18" max="60" value="32"><output id="fontValue">32</output></label><label>背景 <input id="opacity" aria-label="背景不透明度" type="range" min="15" max="95" value="82"><output id="opacityValue">82%</output></label><button id="open" title="打开采集页，请使用 Chrome">采集页 ↗</button><button id="close" aria-label="关闭字幕窗">×</button></div></header><section class="subtitles"><p id="japanese" lang="ja">日文原文会显示在这里</p><p id="chinese" lang="zh-CN">等待字幕…</p></section><footer id="status" role="status">正在连接 Go 后端…</footer></main></body></html>
